name: Container

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing image version to republish (e.g. v0.4.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: inputs.ref != '' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            target: x86_64-unknown-linux-musl
            slug: amd64
          - platform: linux/arm64
            target: aarch64-unknown-linux-musl
            slug: arm64
          - platform: linux/arm/v7
            target: armv7-unknown-linux-musleabihf
            slug: armv7
          - platform: linux/arm/v6
            target: arm-unknown-linux-musleabihf
            slug: armv6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Normalize image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Install cross
        run: |
          curl --fail --location --output cross.tar.gz \
            https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf cross.tar.gz
          chmod 0755 cross
      - name: Cross-compile static binary
        run: ./cross build --locked --release --target '${{ matrix.target }}' -p ownfoil-rs
      - name: Stage binary
        run: |
          mkdir -p dist
          cp 'target/${{ matrix.target }}/release/ownfoil-rs' dist/ownfoil-rs
      - uses: docker/setup-qemu-action@v3
        if: matrix.slug != 'amd64'
        with:
          platforms: ${{ matrix.slug == 'arm64' && 'arm64' || 'arm' }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cross
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:build-${{ inputs.ref || github.sha }}-${{ matrix.slug }}
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}

  manifest:
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.image.result == 'success' || inputs.ref == '') }}
    needs: image
    runs-on: ubuntu-latest
    concurrency:
      group: publish-container-tags
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Normalize image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image tags
        id: tags
        uses: actions/github-script@v7
        env:
          VERSION: ${{ inputs.tag }}
          IMAGE: ${{ env.IMAGE }}
        with:
          script: |
            await require('./scripts/release-plan.cjs').imageTags({github, context, core,
              version: process.env.VERSION, image: process.env.IMAGE});
      - name: Publish multi-architecture manifest
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          REPOSITORY: ${{ env.IMAGE }}
          SHA: ${{ inputs.ref || github.sha }}
          EXISTING_IMAGE: ${{ inputs.ref == '' && format('{0}:{1}', env.IMAGE, inputs.tag) || '' }}
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done <<< "$TAGS"
          if [[ -n "$EXISTING_IMAGE" ]]; then
            sources=("$EXISTING_IMAGE")
          else
            sources=(
              "$REPOSITORY:build-$SHA-amd64"
              "$REPOSITORY:build-$SHA-arm64"
              "$REPOSITORY:build-$SHA-armv7"
              "$REPOSITORY:build-$SHA-armv6"
            )
          fi
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
