<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stats — ownfoil-rs</title><!--theme--></head><body><main class="shell dashboard"><header class="header"><div><h1>Library stats</h1><p>Storage, ownership, and collection health</p></div><nav class="nav" aria-label="Main navigation"><a href="/admin">Library</a><a href="/setup">Setup</a><a href="/admin/settings">Settings</a><a href="/admin/tasks">Tasks</a><a href="/admin/stats" aria-current="page">Stats</a><label class="sr-only" for="theme">Color theme</label><select id="theme" class="theme" data-theme-picker><option value="dark">Dark</option><option value="light">Light</option><option value="ownfoil">Ownfoil</option></select><a href="/admin/logout">Logout</a></nav></header><p id="status" role="status"></p><section><h2>Overview</h2><dl id="totals" class="stat-grid"><div><dt>Collection</dt><dd>…</dd></div></dl></section><section><h2>Files by format</h2><div id="formats"></div></section><section><h2>Libraries</h2><div id="libraries"></div></section><section><h2>Verification</h2><div id="verification"></div></section></main><script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),size=n=>`${(Number(n)/1073741824).toFixed(2)} GiB`;
async function load(){try{const r=await fetch('/api/graphql',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:'{stats{totalFiles totalSize identifiedFiles unidentifiedFiles totalTitles ownedTitles completeTitles upToDateTitles totalApps ownedApps filesByExtension{key count size} filesByLibrary{key count size} filesByVerificationStatus{status count size}}}'})});const d=await r.json();if(d.errors)throw Error(d.errors.map(e=>e.message).join('; '));const s=d.data.stats;document.querySelector('#totals').innerHTML=Object.entries(s).filter(([k,v])=>typeof v==='number').map(([k,v])=>`<div><dt>${esc(k.replace(/([A-Z])/g,' $1'))}</dt><dd>${k==='totalSize'?size(v):v.toLocaleString()}</dd></div>`).join('');for(const [id,key] of [['formats','filesByExtension'],['libraries','filesByLibrary'],['verification','filesByVerificationStatus']]){document.querySelector('#'+id).innerHTML=(s[key]||[]).length?'<div class="table-wrap"><table><thead><tr><th>'+({formats:'Format',libraries:'Path',verification:'Status'}[id])+'</th><th>Files</th><th>Size</th></tr></thead><tbody>'+s[key].map(v=>`<tr><td>${esc(v.key||v.status)}</td><td>${Number(v.count).toLocaleString()}</td><td>${size(v.size)}</td></tr>`).join('')+'</tbody></table></div>':'<p class="muted">No files to report yet.</p>';}document.querySelector('#status').textContent='Updated '+new Date().toLocaleTimeString();}catch(e){document.querySelector('#status').textContent=e.message;}}load();setInterval(load,10000);
</script></body></html>
