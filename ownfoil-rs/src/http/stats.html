<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stats — ownfoil-rs</title><!--theme--></head><body><main class="shell"><header class="header"><h1>Library stats</h1><nav class="nav"><a href="/admin">Library</a><a href="/admin/settings">Settings</a><a href="/admin/tasks">Tasks</a></nav></header><p id="status" role="status"></p><section><h2>Overview</h2><dl id="totals"></dl></section><section><h2>Files by format</h2><div id="formats"></div></section><section><h2>Libraries</h2><div id="libraries"></div></section><section><h2>Verification</h2><div id="verification"></div></section></main><script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),size=n=>`${(Number(n)/1073741824).toFixed(2)} GiB`;
async function load(){try{const r=await fetch('/api/graphql',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:'{stats{totalFiles totalSize identifiedFiles unidentifiedFiles totalTitles ownedTitles completeTitles upToDateTitles totalApps ownedApps filesByExtension{key count size} filesByLibrary{key count size} filesByVerificationStatus{status count size}}}'})});const d=await r.json();if(d.errors)throw Error(d.errors.map(e=>e.message).join('; '));const s=d.data.stats;document.querySelector('#totals').innerHTML=Object.entries(s).filter(([k,v])=>typeof v==='number').map(([k,v])=>`<dt>${esc(k.replace(/([A-Z])/g,' $1'))}</dt><dd>${k==='totalSize'?size(v):v.toLocaleString()}</dd>`).join('');for(const [id,key] of [['formats','filesByExtension'],['libraries','filesByLibrary'],['verification','filesByVerificationStatus']]){document.querySelector('#'+id).innerHTML=(s[key]||[]).map(v=>`<p>${esc(v.key||v.status)}: ${v.count} files, ${size(v.size)}</p>`).join('');}document.querySelector('#status').textContent='Updated '+new Date().toLocaleTimeString();}catch(e){document.querySelector('#status').textContent=e.message;}}load();setInterval(load,10000);
</script></body></html>
