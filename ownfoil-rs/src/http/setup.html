<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ownfoil-rs — Client setup</title>
  <!--theme-->
</head>
<body>
  <main class="shell">
    <header class="header">
      <div><h1>Client setup</h1><p>Connection details for supported clients.</p></div>
      <nav class="nav" aria-label="Main navigation">
        <label class="sr-only" for="theme">Color theme</label>
        <select id="theme" class="theme" data-theme-picker><option value="dark">Black</option><option value="light">Light</option><option value="ownfoil">Ownfoil</option></select>
        <a class="secondary" href="/admin">Library</a>
        <a class="secondary" href="/admin/settings">Settings</a>
        <a class="secondary" href="/admin/logout">Logout</a>
      </nav>
    </header>
    <section class="panel">
      <div role="group" aria-label="Connection location"><button id="local" aria-pressed="true">Local network</button><button id="remote" aria-pressed="false">Remote access</button></div><p id="connection-note"></p><p>Use these addresses in your client. Add <code>/base</code>, <code>/update</code>, <code>/dlc</code>, or <code>/multi</code> to filter content.</p>
    </section>
    <div id="clients" class="client-grid" aria-live="polite"><p class="loading">Loading client settings…</p></div>
    <div id="setup-error" class="notice error" role="alert" hidden>Couldn’t load client settings. Try refreshing the page.</div>
  </main>
  <script>
    fetch('/api/setup').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(settings=>{
      const root=document.querySelector('#clients');
      root.textContent='';
      const local=new URL(location.origin);
      if(settings.external_ip)local.hostname=settings.external_ip;
      let address=local.origin;
      const urls=[];
      function choose(remote){
        address=remote?(settings.host?new URL(settings.host.includes('://')?settings.host:`https://${settings.host}`).origin:location.origin):local.origin;
        document.querySelector('#local').setAttribute('aria-pressed',String(!remote));
        document.querySelector('#remote').setAttribute('aria-pressed',String(remote));
        document.querySelector('#connection-note').textContent=remote?(settings.host?'Use this address outside your home network.':'Set Shop host in Settings to configure your remote address.'):'Connect your console to the same network as this server.';
        for(const node of urls)node.textContent=address;
      }
      document.querySelector('#local').onclick=()=>choose(false);
      document.querySelector('#remote').onclick=()=>choose(true);
      for(const [name,enabled] of Object.entries(settings.clients)){
        const section=document.createElement('section');
        section.className=`panel client${enabled?'':' disabled'}`;
        const title=document.createElement('h2');
        const status=document.createElement('p');
        const url=document.createElement('code');
        title.textContent=name;
        status.className='muted';
        status.textContent=enabled?'Enabled':'Disabled';
        url.textContent=address;
        urls.push(url);
        const instructions=document.createElement('p');
        instructions.textContent=name==='tinfoil'?'Open File Browser, add a source, then enter the protocol, host and port from this address.':name==='sphaira'?'Open the shop settings and add this address as a shop source.':'Add this address in your client’s shop settings.';
        const credentials=document.createElement('p');
        credentials.textContent=settings.public?'Public shop: no shop credentials required.':'Enter the username and password of an account with shop access.';
        section.append(title,status,url,instructions,credentials);
        root.append(section);
      }
      choose(false);
    }).catch(()=>document.querySelector('#setup-error').hidden=false);
  </script>
</body>
</html>
