<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Browse and manage your ownfoil game library.">
  <title>ownfoil-rs — Library</title>
  <!--theme-->
  <!--lcp-->
  <link rel="preload" href="/api/shop/sections?limit=100" as="fetch" crossorigin="use-credentials">
  <link rel="preconnect" href="https://img-eshop.cdn.nintendo.net" crossorigin>
</head>
<body>
<main class="shell">
  <header class="header">
    <div><h1>ownfoil-rs</h1><p>Library browser</p></div>
    <nav class="nav" aria-label="Admin navigation">
      <label class="sr-only" for="theme">Color theme</label>
      <select id="theme" class="theme" data-theme-picker><option value="dark">Black</option><option value="light">Light</option><option value="ownfoil">Ownfoil</option></select>
      <a class="secondary" href="/admin/settings">Settings</a>
      <a class="secondary" href="/admin/logout">Logout</a>
    </nav>
  </header>

  <div class="tabs" role="tablist" aria-label="Library sections">
    <button role="tab" aria-selected="true" data-section="new">New</button>
    <button role="tab" aria-selected="false" data-section="recommended">Recommended</button>
    <button role="tab" aria-selected="false" data-section="updates">Updates</button>
    <button role="tab" aria-selected="false" data-section="dlc">DLC</button>
    <button role="tab" aria-selected="false" data-section="all">All</button>
  </div>

  <p id="loading" class="loading" role="status">Loading library…</p>
  <div id="content" hidden>
    <section id="panel-new" class="tab-panel" role="tabpanel"><div id="grid-new" class="grid"></div></section>
    <section id="panel-recommended" class="tab-panel" role="tabpanel" hidden><div id="grid-recommended" class="grid"></div></section>
    <section id="panel-updates" class="tab-panel" role="tabpanel" hidden><div id="grid-updates" class="grid"></div></section>
    <section id="panel-dlc" class="tab-panel" role="tabpanel" hidden><div id="grid-dlc" class="grid"></div></section>
    <section id="panel-all" class="tab-panel" role="tabpanel" hidden><div id="grid-all" class="grid"></div></section>
  </div>
  <div id="error" class="notice error" role="alert" hidden>Couldn’t load the library. <a href="/admin">Try again</a>.</div>
</main>

<script>
const ids=['new','recommended','updates','dlc','all'];
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const title=name=>String(name||'').replace(/\s*\[[0-9a-f]{16}\](?:\s*\[v\d+\])?\s*/gi,' ').replace(/\s*\.(nsp|xci|nsz|xcz|nca|nspd|xcid)$/i,'').replace(/\s+/g,' ').trim()||name;
const size=bytes=>bytes<1024?`${bytes} B`:bytes<1048576?`${(bytes/1024).toFixed(1)} KB`:bytes<1073741824?`${(bytes/1048576).toFixed(1)} MB`:`${(bytes/1073741824).toFixed(1)} GB`;

function card(item,priority=false){
  const icon=item.icon_url?(item.icon_url.startsWith('http')?item.icon_url:location.origin+item.icon_url):'';
  const source=priority?`src="${esc(icon)}" fetchpriority="high"`:`data-src="${esc(icon)}"`;
  const cover=icon?`<img ${source} alt="" width="256" height="256" onerror="this.parentNode.textContent='📦'">`:'📦';
  return `<article class="game"><div class="cover">${cover}</div><h2 title="${esc(title(item.title_name||item.name))}">${esc(title(item.title_name||item.name))}</h2><span class="badge">${esc(item.app_type)}</span><div class="meta">${esc(item.title_id||'—')} · ${size(item.size)}</div></article>`;
}
const observer='IntersectionObserver'in window?new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){const image=entry.target;image.src=image.dataset.src;image.removeAttribute('data-src');observer.unobserve(image)}})):null;
function watch(root){root.querySelectorAll('img[data-src]').forEach(image=>observer?observer.observe(image):image.src=image.dataset.src)}
function render(id,items){const root=document.querySelector(`#grid-${id}`);root.innerHTML=items.length?items.map((item,index)=>card(item,id==='new'&&index===0)).join(''):'<p class="empty">No items in this section.</p>';watch(root)}
function show(id){
  document.querySelectorAll('[role=tab]').forEach(tab=>tab.setAttribute('aria-selected',tab.dataset.section===id));
  document.querySelectorAll('.tab-panel').forEach(panel=>panel.hidden=panel.id!==`panel-${id}`);
}
document.querySelector('.tabs').onclick=event=>{if(event.target.dataset.section)show(event.target.dataset.section)};
fetch('/api/shop/sections?limit=100',{credentials:'include'}).then(response=>{if(!response.ok)throw new Error(response.status);return response.json()}).then(data=>{
  const sections=Object.fromEntries(data.sections.map(section=>[section.id,section.items||[]]));
  ids.forEach(id=>render(id,sections[id]||[]));
  document.querySelector('#loading').hidden=true;
  document.querySelector('#content').hidden=false;
}).catch(()=>{document.querySelector('#loading').hidden=true;document.querySelector('#error').hidden=false});
</script>
</body>
</html>
