<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Browse your library, identify missing updates and DLC, and manage game files."><title>ownfoil-rs — Library</title><!--theme--><!--lcp--></head><body><main class="shell"><header class="header"><div><h1>Library</h1><p>Browse and manage your collection</p></div><nav class="nav" aria-label="Main navigation"><a href="/admin" aria-current="page">Library</a><a href="/setup">Setup</a><a href="/admin/settings">Settings</a><a href="/admin/tasks">Tasks</a><a href="/admin/stats">Stats</a><label class="sr-only" for="theme">Color theme</label><select id="theme" class="theme" data-theme-picker><option value="dark">Dark</option><option value="light">Light</option><option value="ownfoil">Ownfoil</option></select><a href="/admin/logout">Logout</a></nav></header>
<form id="filters" class="library-toolbar"><label class="search-field">Search<input type="search" name="search" placeholder="Game name or title ID"></label><label>Ownership<select name="owned"><option value="">All</option><option value="true">Owned</option><option value="false">Missing</option></select></label><label>Updates<select name="updated"><option value="">All</option><option value="true">Up to date</option><option value="false">Missing</option></select></label><label>DLC set<select name="complete"><option value="">All</option><option value="true">Complete</option><option value="false">Incomplete</option></select></label><label>Content<select name="type"><option value="BASE">Games</option><option value="DLC">DLC</option><option value="UPDATE">Updates</option><option value="">All content</option></select></label><label>Sort<select name="sort"><option value="NAME">Name</option><option value="RELEASE_DATE">Release date</option><option value="VERSION">Version</option></select></label><label>Page size<select name="pageSize"><option>24</option><option>48</option><option>100</option><option>250</option></select></label><label class="view-field">View<select name="view"><option value="cards">Cards</option><option value="icons">Icons</option></select></label><label class="size-field">Card size<input name="cardSize" type="range" min="120" max="340" value="220"></label></form>
<p id="status" role="status" aria-live="polite">Loading library…</p><section id="grid" class="library-grid" aria-label="Library"></section><div class="pagination"><button id="previous">Previous</button><span id="page"></span><button id="next">Next</button></div><dialog id="metadata"><form method="dialog"><h2>Title metadata</h2><p>Override selected fields. Other fields keep their catalogue values.</p><textarea id="record" aria-label="Metadata JSON" spellcheck="false"></textarea><div class="actions"><button id="save-record" type="button">Save</button><button id="reset-record" class="secondary" type="button">Restore catalogue metadata</button><button class="secondary">Close</button></div><p id="metadata-error" role="alert"></p></form></dialog></main>
<script>
const $=s=>document.querySelector(s),f=$('#filters'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let page=1,total=0,sequence=0,items=[],editId;
const bool=s=>s===''?null:s==='true';const bytes=n=>`${(Number(n)/1073741824).toFixed(2)} GiB`;
async function gql(query,variables={}){const r=await fetch('/api/graphql',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,variables})});if(r.status===401){location.href='/login';throw Error('Login required');}const d=await r.json();if(!r.ok||d.errors)throw Error(d.errors?.map(e=>e.message).join('; ')||r.status);return d.data;}
const query=`query($owned:Boolean,$type:[AppType!],$updated:Boolean,$complete:Boolean,$search:String,$page:Int!,$size:Int!,$order:OrderBy){apps(owned:$owned,appType:$type,upToDate:$updated,complete:$complete,search:$search,page:$page,pageSize:$size,orderBy:$order,groupByAppId:true){total items{id appId appVersion appType owned releaseDate title{titleId name iconUrl ownership{haveBase upToDate complete}} titledb{name iconUrl} versions{version owned releaseDate} files{id filename size compressed verificationStatus}}}}`;
function card(a){const title=a.titledb?.name||a.title?.name||a.appId,icon=a.titledb?.iconUrl||a.title?.iconUrl;const owned=a.title?.ownership;return `<article class="game"><div class="cover">${icon&&/^(https?:\/\/|\/)/.test(icon)?`<img src="${esc(icon)}" loading="lazy" alt="" width="256" height="256">`:'<span aria-label="No artwork">No artwork</span>'}</div><h2>${esc(title)}</h2><span class="badge">${esc(a.appType)}</span> <span class="badge ${a.owned?'owned':''}">${a.owned?'Owned':'Missing'}</span><div class="description"><p class="meta">${esc(a.appId)}</p>${a.appType==='BASE'?`<p>${owned?.upToDate?'Up to date':'Update missing'} · ${owned?.complete?'DLC complete':'DLC incomplete'}</p>`:''}<details><summary>Versions · v${Number(a.appVersion)}</summary>${(a.versions||[]).map(v=>`<p>v${v.version} · ${v.owned?'Owned':'Missing'} · ${esc(v.releaseDate||'Unknown date')}</p>`).join('')||'<p>No known updates</p>'}</details>${a.files!==null?`<details><summary>Files (${a.files?.length||0})</summary>${(a.files||[]).map(file=>`<p>${esc(file.filename)} · ${bytes(file.size)} · ${esc(file.verificationStatus)}</p><div class="file-actions"><a href="/api/get_game/${encodeURIComponent(file.id)}">Download</a><button data-file="${esc(file.id)}" data-action="verifyFile">Verify</button><button data-file="${esc(file.id)}" data-action="${file.compressed?'decompressFile':'compressFile'}">${file.compressed?'Decompress':'Compress'}</button></div>`).join('')}<button data-edit="${esc(a.title?.titleId||a.appId)}">Edit title metadata</button></details>`:''}</div></article>`;}
async function load(){const current=++sequence;$('#status').textContent='Loading library…';$('#grid').setAttribute('aria-busy','true');try{const d=await gql(query,{owned:bool(f.owned.value),type:f.type.value?[f.type.value]:null,updated:bool(f.updated.value),complete:bool(f.complete.value),search:f.search.value,page,size:Number(f.pageSize.value),order:{field:f.sort.value,direction:'ASC'}});if(current!==sequence)return;$('#grid').setAttribute('aria-busy','false');items=d.apps.items;total=d.apps.total;$('#grid').innerHTML=items.length?items.map(card).join(''):'<div class="empty">No titles match these filters. Try a different search or ownership filter.</div>';$('#status').textContent=total?`${total.toLocaleString()} matching apps`:'No matching apps';$('#page').textContent=`Page ${page} of ${Math.max(1,Math.ceil(total/Number(f.pageSize.value)))}`;$('#previous').disabled=page<=1;$('#next').disabled=page*Number(f.pageSize.value)>=total;}catch(e){if(current!==sequence)return;$('#grid').setAttribute('aria-busy','false');$('#status').textContent=e.message;}}
let debounce;f.onsubmit=e=>e.preventDefault();f.oninput=e=>{if(e.target===f.cardSize){$('#grid').style.setProperty('--card-size',f.cardSize.value+'px');return;}if(e.target===f.view){$('#grid').classList.toggle('icons',f.view.value==='icons');return;}clearTimeout(debounce);page=1;debounce=setTimeout(load,e.target===f.search?250:0);};$('#previous').onclick=()=>{page--;load();};$('#next').onclick=()=>{page++;load();};
$('#grid').onclick=async e=>{const action=e.target.dataset.action,id=e.target.dataset.file;if(action&&id){e.target.disabled=true;try{await gql(`mutation($id:ID!){${action}(fileId:$id){id}}`,{id});$('#status').textContent='Task queued. Follow progress on Tasks.';}catch(error){$('#status').textContent=error.message;}finally{e.target.disabled=false;}}if(e.target.dataset.edit){editId=e.target.dataset.edit;const item=items.find(a=>a.title?.titleId===editId);$('#record').value=JSON.stringify({name:item?.title?.name||''},null,2);$('#metadata-error').textContent='';$('#metadata').showModal();}};
$('#save-record').onclick=async()=>{try{const record=JSON.parse($('#record').value);await gql('mutation($id:ID!,$record:String!){setTitleOverride(titleId:$id,record:$record){titleId}}',{id:editId,record:JSON.stringify(record)});$('#metadata').close();load();}catch(e){$('#metadata-error').textContent=e.message;}};$('#reset-record').onclick=async()=>{try{await gql('mutation($id:ID!){deleteTitleOverride(titleId:$id)}',{id:editId});$('#metadata').close();load();}catch(e){$('#metadata-error').textContent=e.message;}};load();
</script></body></html>
