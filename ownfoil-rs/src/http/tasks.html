<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasks — ownfoil-rs</title><!--theme--></head><body><main class="shell dashboard"><header class="header"><div><h1>Tasks</h1><p>Monitor workers and background activity</p></div><nav class="nav" aria-label="Main navigation"><a href="/admin">Library</a><a href="/setup">Setup</a><a href="/admin/settings">Settings</a><a href="/admin/tasks" aria-current="page">Tasks</a><a href="/admin/stats">Stats</a><label class="sr-only" for="theme">Color theme</label><select id="theme" class="theme" data-theme-picker><option value="dark">Dark</option><option value="light">Light</option><option value="ownfoil">Ownfoil</option></select><a href="/admin/logout">Logout</a></nav></header><p id="status" role="status"></p><section><h2>Workers</h2><div id="workers" class="worker-grid"><p class="muted">Connecting to workers…</p></div></section><section><h2>Background tasks</h2><div class="actions"><button id="scan">Scan library</button><button id="refresh">Refresh TitleDB</button><button id="purge" class="secondary">Dismiss all failures</button></div><div class="table-wrap"><table><thead><tr><th>Task</th><th>Status</th><th>Progress</th><th>Error</th><th>Action</th></tr></thead><tbody id="tasks"><tr><td colspan="5" class="muted">Connecting to tasks…</td></tr></tbody></table></div></section></main><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function gql(query,variables={}){const r=await fetch('/api/graphql',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,variables})});const d=await r.json();if(!r.ok||d.errors)throw Error(d.errors?.map(e=>e.message).join('; ')||r.status);return d.data;}
function tasks(rows){$('#tasks').innerHTML=rows.map(t=>`<tr><td>${esc(t.displayName)}</td><td>${esc(t.status)}</td><td><progress max="100" value="${Number(t.completionPct)}"></progress> ${Number(t.completionPct)}%</td><td>${esc(t.errorMessage)}</td><td>${t.status==='failed'?`<button data-dismiss="${esc(t.id)}">Dismiss</button>`:['pending','running','waiting_for_children'].includes(t.status)?`<button data-cancel="${esc(t.id)}">Cancel</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5">No tasks</td></tr>';}
function workers(rows){$('#workers').innerHTML=rows.map(w=>`<div class="worker"><strong>Worker ${esc(w.id)}</strong><span>${w.taskId?`Task ${esc(w.taskId)}`:'Idle'}</span></div>`).join('')||'<p class="muted">No workers available.</p>';}
async function act(query,variables){try{await gql(query,variables);$('#status').textContent='Saved';}catch(e){$('#status').textContent=e.message;}}
$('#scan').onclick=()=>act('mutation { scanLibrary { id } }');$('#refresh').onclick=()=>act('mutation { enqueueTask(name:"update_titledb") { id } }');$('#purge').onclick=()=>act('mutation { purgeFailedTasks }');$('#tasks').onclick=e=>{if(e.target.dataset.cancel)act('mutation($id:ID!){cancelTask(id:$id)}',{id:e.target.dataset.cancel});if(e.target.dataset.dismiss)act('mutation($id:ID!){dismissTask(id:$id)}',{id:e.target.dataset.dismiss});};
const live={tasks:[],workers:[]};let timer;function connect(){const socket=new WebSocket(`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws/realtime?topics=tasks,workers`);socket.onopen=()=>{$('#status').textContent='Live';};socket.onmessage=e=>{const m=JSON.parse(e.data);if(!Object.hasOwn(live,m.topic))return;if(m.type==='snapshot')live[m.topic]=m.data;else{const rows=live[m.topic],i=rows.findIndex(r=>r.id===m.data.id);if(m.type==='remove'){if(i>=0)rows.splice(i,1);}else if(i>=0)rows[i]=m.data;else rows.push(m.data);}if(m.topic==='tasks')tasks(live.tasks);if(m.topic==='workers')workers(live.workers);};socket.onclose=()=>{$('#status').textContent='Reconnecting…';timer=setTimeout(connect,2000);};}connect();addEventListener('beforeunload',()=>clearTimeout(timer));
</script></body></html>
