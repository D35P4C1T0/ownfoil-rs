<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ownfoil Settings</title><style>
body{font:15px system-ui;max-width:1050px;margin:2rem auto;padding:0 1rem;background:#111827;color:#f3f4f6}a{color:#93c5fd}
section{background:#1f2937;padding:1rem 1.3rem;margin:1rem 0;border-radius:.6rem}fieldset{border:0;padding:.25rem 0;display:grid;gap:.3rem}
input,textarea,select,button{font:inherit;padding:.45rem;border-radius:.3rem;border:1px solid #4b5563;background:#111827;color:#f3f4f6}
button{cursor:pointer;background:#2563eb}button.secondary{background:#374151}.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:150px}
label.check{display:inline-flex;gap:.4rem;align-items:center;margin:.3rem .8rem .3rem 0}.status{position:sticky;top:.5rem;padding:.7rem;background:#064e3b;display:none;border-radius:.4rem}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.4rem;border-bottom:1px solid #374151}small{opacity:.75}
</style></head><body>
<nav><a href="/">Library</a> · <a href="/setup">Setup</a> · <a href="/logout">Logout</a></nav><h1>Settings</h1><div id="status" class="status"></div>

<section><h2>Titles and console keys</h2><form id="titles"><div class="row"><fieldset><label>Region</label><input name="region" required></fieldset><fieldset><label>Language</label><input name="language" required></fieldset><button>Save titles</button></div></form>
<form id="keys"><fieldset><label>keys.txt</label><input name="file" type="file" accept=".txt,.keys" required></fieldset><button>Upload and rescan</button></form><pre id="key-status"></pre></section>

<section><h2>Shop</h2><form id="shop"><div class="row"><fieldset><label>Remote host</label><input name="host"></fieldset><fieldset><label>MOTD</label><input name="motd"></fieldset></div>
<label class="check"><input type="checkbox" name="public">Public shop</label><label class="check"><input type="checkbox" name="tinfoil">Tinfoil</label><label class="check"><input type="checkbox" name="encrypt">Encrypt Tinfoil</label><label class="check"><input type="checkbox" name="cyberfoil">CyberFoil</label><label class="check"><input type="checkbox" name="sphaira">Sphaira</label><br><button>Save shop</button></form></section>

<section><h2>Libraries</h2><table><thead><tr><th>Path</th><th></th></tr></thead><tbody id="paths"></tbody></table><form id="path-add" class="row"><fieldset><label>Add directory</label><input name="path" required></fieldset><button>Add</button></form><button id="scan">Scan all now</button></section>

<section><h2>Library management</h2><form id="management"><label class="check"><input type="checkbox" name="delete_older_updates">Delete older updates</label><label class="check"><input type="checkbox" name="organizer_enabled">Enable organizer</label><label class="check"><input type="checkbox" name="remove_empty_folders">Remove empty folders</label><label class="check"><input type="checkbox" name="windows_compatible">Windows-compatible names</label>
<div class="row"><fieldset><label>Base template</label><input name="base"></fieldset><fieldset><label>Update template</label><input name="update"></fieldset></div><div class="row"><fieldset><label>DLC template</label><input name="dlc"></fieldset><fieldset><label>Multi template</label><input name="multi"></fieldset></div><button>Save management</button> <button type="button" class="secondary" id="preview">Preview moves</button><pre id="preview-output"></pre></form></section>

<section><h2>Scheduler</h2><form id="scheduler" class="row"><fieldset><label>Scan interval</label><input name="scan_interval" placeholder="12h or 0" required><small>s, m, h, d; 0 disables</small></fieldset><button>Save scheduler</button></form></section>

<section><h2>Users</h2><table><thead><tr><th>User</th><th>Admin</th><th>Shop</th><th>Backup</th><th></th></tr></thead><tbody id="users"></tbody></table><form id="user-add"><div class="row"><fieldset><label>Username</label><input name="user" required></fieldset><fieldset><label>Password</label><input name="password" type="password" required></fieldset></div><label class="check"><input type="checkbox" name="admin_access">Admin</label><label class="check"><input type="checkbox" name="shop_access" checked>Shop</label><label class="check"><input type="checkbox" name="backup_access">Backup</label><br><button>Add user</button></form></section>

<script>
const $=s=>document.querySelector(s), status=t=>{const e=$('#status');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3500)};
const api=(url,opt={})=>fetch(url,{credentials:'include',...opt,headers:{...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opt.headers||{})}}).then(async r=>{if(!r.ok)throw new Error((await r.text())||r.status);return r.json()});
let settings;
async function load(){settings=await api('/api/settings');const t=$('#titles');t.region.value=settings.titles.region;t.language.value=settings.titles.language;$('#key-status').textContent=`Valid: ${settings.titles.valid_keys}\nMissing: ${(settings.titles.missing_keys||[]).join(', ')||'none'}\nCorrupt: ${(settings.titles.corrupt_keys||[]).join(', ')||'none'}`;
const s=$('#shop');s.host.value=settings.shop.host;s.motd.value=settings.shop.motd;s.public.checked=settings.shop.public;s.tinfoil.checked=settings.shop.clients.tinfoil.enabled;s.encrypt.checked=settings.shop.clients.tinfoil.encrypt;s.cyberfoil.checked=settings.shop.clients.cyberfoil.enabled;s.sphaira.checked=settings.shop.clients.sphaira.enabled;
const m=$('#management'),mg=settings.library.management;m.delete_older_updates.checked=mg.delete_older_updates;m.organizer_enabled.checked=mg.organizer.enabled;m.remove_empty_folders.checked=mg.organizer.remove_empty_folders;m.windows_compatible.checked=mg.organizer.windows_compatible;for(const k of ['base','update','dlc','multi'])m[k].value=mg.organizer.templates[k];$('#scheduler').scan_interval.value=settings.scheduler.scan_interval;await Promise.all([loadPaths(),loadUsers()]);}
async function loadPaths(){const d=await api('/api/settings/library/paths');$('#paths').innerHTML=d.paths.map(p=>`<tr><td>${esc(p)}</td><td><button class="secondary" data-path="${esc(p)}">Remove</button></td></tr>`).join('');}
async function loadUsers(){const u=await api('/api/users');$('#users').innerHTML=u.map(x=>`<tr><td>${esc(x.user)}</td><td>${x.admin_access?'✓':''}</td><td>${x.shop_access?'✓':''}</td><td>${x.backup_access?'✓':''}</td><td><button class="secondary" data-user="${x.id}">Delete</button></td></tr>`).join('');}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function submit(form,url,build){form.addEventListener('submit',async e=>{e.preventDefault();try{const d=await api(url,{method:'POST',body:JSON.stringify(build(form))});status(d.success===false?(d.error||JSON.stringify(d.errors)):'Saved');await load()}catch(x){status(x.message)}})}
submit($('#titles'),'/api/settings/titles',f=>({region:f.region.value,language:f.language.value}));
submit($('#shop'),'/api/settings/shop',f=>({...settings.shop,host:f.host.value,motd:f.motd.value,public:f.public.checked,clients:{...settings.shop.clients,tinfoil:{...settings.shop.clients.tinfoil,enabled:f.tinfoil.checked,encrypt:f.encrypt.checked},cyberfoil:{...settings.shop.clients.cyberfoil,enabled:f.cyberfoil.checked},sphaira:{enabled:f.sphaira.checked}}}));
submit($('#management'),'/api/settings/library/management',f=>({compress_files:false,delete_older_updates:f.delete_older_updates.checked,organizer:{enabled:f.organizer_enabled.checked,remove_empty_folders:f.remove_empty_folders.checked,windows_compatible:f.windows_compatible.checked,templates:Object.fromEntries(['base','update','dlc','multi'].map(k=>[k,f[k].value]))}}));
submit($('#scheduler'),'/api/settings/scheduler',f=>({scan_interval:f.scan_interval.value}));submit($('#path-add'),'/api/settings/library/paths',f=>({path:f.path.value}));
submit($('#user-add'),'/api/user/signup',f=>({user:f.user.value,password:f.password.value,admin_access:f.admin_access.checked,shop_access:f.shop_access.checked,backup_access:f.backup_access.checked}));
$('#paths').onclick=async e=>{if(e.target.dataset.path){await api('/api/settings/library/paths',{method:'DELETE',body:JSON.stringify({path:e.target.dataset.path})});load()}};
$('#users').onclick=async e=>{if(e.target.dataset.user){await api('/api/user',{method:'DELETE',body:JSON.stringify({user_id:Number(e.target.dataset.user)})});load()}};
$('#scan').onclick=async()=>{status('Scan running…');const d=await api('/api/library/scan',{method:'POST',body:JSON.stringify({path:null})});status(d.success?'Scan complete':'Scan already running')};
$('#preview').onclick=async()=>{const d=await api('/api/library/organize/preview',{method:'POST',body:'{}'});$('#preview-output').textContent=d.moves.map(m=>`${m.source} → ${m.destination}`).join('\n')||'No moves planned'};
$('#keys').onsubmit=async e=>{e.preventDefault();const data=new FormData(e.target);const d=await api('/api/upload',{method:'POST',body:data});status(d.success?'Keys uploaded':'Upload failed');await load()};
load().catch(e=>status(e.message));
</script></body></html>
