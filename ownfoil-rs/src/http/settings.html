<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ownfoil-rs — Settings</title><!--theme--></head><body class="settings"><main class="shell">
<header class="header"><div><h1>Settings</h1><p>Library, shop, and access controls</p></div><nav class="nav" aria-label="Admin navigation"><label class="sr-only" for="theme">Color theme</label><select id="theme" class="theme" data-theme-picker><option value="dark">Black</option><option value="light">Light</option><option value="ownfoil">Ownfoil</option></select><a class="secondary" href="/admin">Library</a><a class="secondary" href="/setup">Setup</a><a class="secondary" href="/admin/logout">Logout</a></nav></header><div id="status" class="toast" role="status" aria-live="polite" hidden></div>

<section><h2>Titles and console keys</h2><form id="titles"><div class="row"><fieldset><label>Region</label><input name="region" required></fieldset><fieldset><label>Language</label><input name="language" required></fieldset><button>Save title settings</button></div></form>
<form id="keys"><fieldset><label>keys.txt</label><input name="file" type="file" accept=".txt,.keys" required></fieldset><button>Upload and rescan</button></form><pre id="key-status"></pre></section>

<section><h2>Shop</h2><form id="shop"><div class="row"><fieldset><label>Remote host</label><input name="host"></fieldset><fieldset><label>MOTD</label><input name="motd"></fieldset></div>
<div class="checks"><label class="check"><input type="checkbox" name="public">Public shop</label><label class="check"><input type="checkbox" name="tinfoil">Tinfoil</label><label class="check"><input type="checkbox" name="encrypt">Encrypt Tinfoil</label><label class="check"><input type="checkbox" name="cyberfoil">CyberFoil</label><label class="check"><input type="checkbox" name="sphaira">Sphaira</label></div><button>Save shop settings</button></form></section>

<section><h2>Libraries</h2><div class="table-wrap"><table><thead><tr><th>Path</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody id="paths"></tbody></table></div><form id="path-add" class="row"><fieldset><label>Add directory</label><input name="path" required></fieldset><button>Add library</button></form><div class="actions"><button type="button" id="scan">Scan all now</button></div></section>

<section><h2>Library management</h2><form id="management"><div class="checks"><label class="check"><input type="checkbox" name="delete_older_updates">Delete older updates</label><label class="check"><input type="checkbox" name="organizer_enabled">Enable organizer</label><label class="check"><input type="checkbox" name="remove_empty_folders">Remove empty folders</label><label class="check"><input type="checkbox" name="windows_compatible">Windows-compatible names</label></div>
<div class="row"><fieldset><label>Base template</label><input name="base"></fieldset><fieldset><label>Update template</label><input name="update"></fieldset></div><div class="row"><fieldset><label>DLC template</label><input name="dlc"></fieldset><fieldset><label>Multi template</label><input name="multi"></fieldset></div><div class="actions"><button>Save organization</button><button type="button" class="secondary" id="preview">Preview moves</button></div><pre id="preview-output"></pre></form></section>

<section><h2>Scheduler</h2><form id="scheduler" class="row"><fieldset><label>Scan interval</label><input name="scan_interval" placeholder="12h or 0" required><small>s, m, h, d; 0 disables</small></fieldset><button>Save schedule</button></form></section>

<section><h2>Users</h2><div class="table-wrap"><table><thead><tr><th>User</th><th>Admin</th><th>Shop</th><th>Backup</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody id="users"></tbody></table></div><form id="user-add"><div class="row"><fieldset><label>Username</label><input name="user" autocomplete="username" required></fieldset><fieldset><label>Password</label><input name="password" type="password" autocomplete="new-password" required></fieldset></div><div class="checks"><label class="check"><input type="checkbox" name="admin_access">Admin</label><label class="check"><input type="checkbox" name="shop_access" checked>Shop</label><label class="check"><input type="checkbox" name="backup_access">Backup</label></div><button>Add user</button></form></section>

<script>
let statusTimer;const $=s=>document.querySelector(s), status=(t,error=false)=>{const e=$('#status');clearTimeout(statusTimer);e.textContent=t;e.classList.toggle('error',error);e.setAttribute('role',error?'alert':'status');e.hidden=false;statusTimer=setTimeout(()=>e.hidden=true,3500)};
const api=(url,opt={})=>fetch(url,{credentials:'include',...opt,headers:{...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opt.headers||{})}}).then(async r=>{if(!r.ok)throw new Error((await r.text())||r.status);return r.json()});
let settings;
async function load(){settings=await api('/api/settings');const t=$('#titles');t.region.value=settings.titles.region;t.language.value=settings.titles.language;$('#key-status').textContent=`Valid: ${settings.titles.valid_keys}\nMissing: ${(settings.titles.missing_keys||[]).join(', ')||'none'}\nCorrupt: ${(settings.titles.corrupt_keys||[]).join(', ')||'none'}`;
const s=$('#shop');s.host.value=settings.shop.host;s.motd.value=settings.shop.motd;s.public.checked=settings.shop.public;s.tinfoil.checked=settings.shop.clients.tinfoil.enabled;s.encrypt.checked=settings.shop.clients.tinfoil.encrypt;s.cyberfoil.checked=settings.shop.clients.cyberfoil.enabled;s.sphaira.checked=settings.shop.clients.sphaira.enabled;
const m=$('#management'),mg=settings.library.management;m.delete_older_updates.checked=mg.delete_older_updates;m.organizer_enabled.checked=mg.organizer.enabled;m.remove_empty_folders.checked=mg.organizer.remove_empty_folders;m.windows_compatible.checked=mg.organizer.windows_compatible;for(const k of ['base','update','dlc','multi'])m[k].value=mg.organizer.templates[k];$('#scheduler').scan_interval.value=settings.scheduler.scan_interval;await Promise.all([loadPaths(),loadUsers()]);}
async function loadPaths(){const d=await api('/api/settings/library/paths');$('#paths').innerHTML=d.paths.map(p=>`<tr><td>${esc(p)}</td><td><button class="secondary" data-path="${esc(p)}">Remove</button></td></tr>`).join('')||'<tr><td colspan="2" class="muted">No libraries configured.</td></tr>';}
async function loadUsers(){const u=await api('/api/users');$('#users').innerHTML=u.map(x=>`<tr><td>${esc(x.user)}</td><td>${x.admin_access?'✓':''}</td><td>${x.shop_access?'✓':''}</td><td>${x.backup_access?'✓':''}</td><td><button class="secondary" data-user="${x.id}">Delete user</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">No users configured.</td></tr>';}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function submit(form,url,build){form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button[type="submit"],button:not([type])');button.disabled=true;try{const d=await api(url,{method:'POST',body:JSON.stringify(build(form))});const failed=d.success===false;status(failed?(d.error||JSON.stringify(d.errors)):'Saved',failed);if(!failed)await load()}catch(x){status(x.message,true)}finally{button.disabled=false}})}
submit($('#titles'),'/api/settings/titles',f=>({region:f.region.value,language:f.language.value}));
submit($('#shop'),'/api/settings/shop',f=>({...settings.shop,host:f.host.value,motd:f.motd.value,public:f.public.checked,clients:{...settings.shop.clients,tinfoil:{...settings.shop.clients.tinfoil,enabled:f.tinfoil.checked,encrypt:f.encrypt.checked},cyberfoil:{...settings.shop.clients.cyberfoil,enabled:f.cyberfoil.checked},sphaira:{enabled:f.sphaira.checked}}}));
submit($('#management'),'/api/settings/library/management',f=>({compress_files:false,delete_older_updates:f.delete_older_updates.checked,organizer:{enabled:f.organizer_enabled.checked,remove_empty_folders:f.remove_empty_folders.checked,windows_compatible:f.windows_compatible.checked,templates:Object.fromEntries(['base','update','dlc','multi'].map(k=>[k,f[k].value]))}}));
submit($('#scheduler'),'/api/settings/scheduler',f=>({scan_interval:f.scan_interval.value}));submit($('#path-add'),'/api/settings/library/paths',f=>({path:f.path.value}));
submit($('#user-add'),'/api/user/signup',f=>({user:f.user.value,password:f.password.value,admin_access:f.admin_access.checked,shop_access:f.shop_access.checked,backup_access:f.backup_access.checked}));
$('#paths').onclick=async e=>{if(e.target.dataset.path)try{e.target.disabled=true;await api('/api/settings/library/paths',{method:'DELETE',body:JSON.stringify({path:e.target.dataset.path})});status('Library removed');await load()}catch(x){status(x.message,true)}};
$('#users').onclick=async e=>{if(e.target.dataset.user)try{e.target.disabled=true;await api('/api/user',{method:'DELETE',body:JSON.stringify({user_id:Number(e.target.dataset.user)})});status('User deleted');await load()}catch(x){status(x.message,true)}};
$('#scan').onclick=async()=>{const b=$('#scan');b.disabled=true;status('Scan running…');try{const d=await api('/api/library/scan',{method:'POST',body:JSON.stringify({path:null})});status(d.success?'Scan complete':'Scan already running',!d.success)}catch(x){status(x.message,true)}finally{b.disabled=false}};
$('#preview').onclick=async()=>{const b=$('#preview');b.disabled=true;try{const d=await api('/api/library/organize/preview',{method:'POST',body:'{}'});$('#preview-output').textContent=d.moves.map(m=>`${m.source} → ${m.destination}`).join('\n')||'No moves planned'}catch(x){status(x.message,true)}finally{b.disabled=false}};
$('#keys').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const data=new FormData(e.target);const d=await api('/api/upload',{method:'POST',body:data});status(d.success?'Keys uploaded':'Upload failed',!d.success);if(d.success)await load()}catch(x){status(x.message,true)}finally{b.disabled=false}};
load().catch(e=>status(e.message,true));
</script></main></body></html>
